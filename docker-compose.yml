services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-log}
      AUTH0_ISSUER: ${AUTH0_ISSUER-}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE-}
      AUTH0_CLIENT_IDS: ${AUTH0_CLIENT_IDS-}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET-}
      AUTH0_MGMT_AUDIENCE: ${AUTH0_MGMT_AUDIENCE-}
      ACCOUNT_DELETION_POLL_MS: ${ACCOUNT_DELETION_POLL_MS:-5000}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, auth0-egress]
  migrate:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    profiles: [tools]
  integration-test:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "test:integration"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    profiles: [tools]
  seed:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "prisma:seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    profiles: [tools]
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./ops/frontend:/usr/share/nginx/html:ro
      - ./ops/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
  proxy:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: [./ops/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_started}
    networks: [edge, backend]
volumes:
  postgres-data:
networks:
  edge:
  auth0-egress:
  backend:
    internal: true
